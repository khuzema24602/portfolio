<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fode Restaurant</title>

    <!-- CSS -->
    <link rel="stylesheet" href="styleone.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>
<body>

<div class="container">

    <!-- ================= NAVBAR ================= -->

    <nav>

        <div class="logo">
            <i class="fa-solid fa-bowl-food"></i>
            <span>Fode</span>
        </div>

        <ul>

            <li><a href="#">Why Fode?</a></li>
            <li><a href="#">Menu</a></li>
            <li><a href="#">Location</a></li>

        </ul>

        <div class="icons">

            <i class="fa-solid fa-magnifying-glass"></i>
            <i class="fa-solid fa-bars"></i>

        </div>

    </nav>



    <!-- ================= HERO ================= -->


<section class="hero">


<div class="left">

<h3>Italian</h3>

<h1>Penne Pasta</h1>

<p>

Festive Dining At Farthings Where We Are Strong
Believers In Using The Very Best Produce.

</p>

<div class="price-box">

<button>Order Food</button>

<h2>$8.85</h2>

</div>

</div>




<div class="right">


<div class="circle circle1"></div>

<div class="circle circle2"></div>

<div class="circle circle3"></div>

<div class="circle circle4"></div>


<img src="./pasta.jpg" class="main-food">


<img src="./Tomato_je.jpg" class="veg tomato">

<img src="./chilli.avif" class="veg chilli">

<img src="./basil.jpg" class="veg basil">

<img src="./onion.jpg" class="veg onion">

<img src="./leaf.jpg" class="veg leaf">

</div>

</section>




<!-- ================= FOOD SLIDER ================= -->


<section class="foods">


<button class="arrow left-arrow" id="prev">

<i class="fa-solid fa-angle-left"></i>

</button>




<div class="cards" id="cards">



<div class="card">

<img src="./sauce thai.jpg">

<h3>Sauce Thai Food</h3>

</div>




<div class="card">

<img src="./fried rice.jpg">

<h3>Fried Rice</h3>

</div>




<div class="card">

<img src="./pho ga.jpg">

<h3>Pollo Gourmet</h3>

</div>




<div class="card">

<img src="./pollo gourmet.jpg">

<h3>Including Pho Ga</h3>

</div>




<div class="card">

<img src="./pasta.jpg">

<h3>Penne Pasta</h3>

</div>




<div class="card">

<img src="./sauce thai.jpg">

<h3>Sauce Thai Food</h3>

</div>



</div>



<button class="arrow right-arrow" id="next">

<i class="fa-solid fa-angle-right"></i>

</button>


</section>


</div>
<script src="script.js"></script>
</body>
</html>
